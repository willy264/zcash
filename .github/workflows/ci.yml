name: Darkroom privacy regression

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_preview:
        description: 'Publish the replay branch under its review path, preserving main Pages files'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: darkroom-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prove:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.3'
          cache: false
      - name: Formatting, lint, and negative-control tests
        run: |
          make check
          make test
      - name: Real fixture, leaky trace, fixed trace, strict assertions
        run: make demo
      - name: Upload branch evidence for review
        if: github.ref != 'refs/heads/main' || github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: darkroom-report-${{ github.sha }}
          path: report
          if-no-files-found: error
          retention-days: 14
      - name: Upload the generated evidence report
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: report

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: prove
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment

  replay-preview:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_preview && github.ref == 'refs/heads/report-interactive-replay'
    needs: prove
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    # Serialize with main publication; never cancel a production deployment.
    concurrency:
      group: darkroom-Darkroom privacy regression-refs/heads/main
      cancel-in-progress: false
      queue: max
    environment:
      name: github-pages-preview
      url: https://willy264.github.io/zcash/previews/report-interactive-replay/
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download the unchanged main site and this run's branch report
        run: |
          main_run=$(python -c 'import json; print(json.load(open(".github/preview-base.json"))["main_run"])')
          gh run download "$main_run" --name github-pages --dir .runs/main-pages
          gh run download "$GITHUB_RUN_ID" --name "darkroom-report-$GITHUB_SHA" --dir .runs/branch-report
      - name: Preserve the main site and add the isolated review path
        run: |
          python scripts/preview_pages.py prepare \
            --main-archive .runs/main-pages/artifact.tar \
            --branch-report .runs/branch-report --branch-sha "$GITHUB_SHA" \
            --output .runs/preview-site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: darkroom-replay-preview
          path: .runs/preview-site
      - name: Recheck main before publication
        run: python scripts/preview_pages.py check-main
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: darkroom-replay-preview
      - name: Verify deployed main and preview bytes
        run: python scripts/preview_pages.py verify --output .runs/preview-site
